<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C130D"/>
      <stop offset="100%" stop-color="#3D2410"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DC7B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#C26E38"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  
  <!-- Ambient Inner Glow -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>
  
  <!-- Gold Border Ring -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.85"/>
  
  <!-- Santiago's Script/Serif 'S' Monogram -->
  <text x="32" y="46" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="42" font-style="italic" font-weight="700" fill="url(#gold)" text-anchor="middle">S</text>
  
  <!-- Top Gold Sparkle Accent -->
  <polygon points="46,14 47.5,17.5 51,19 47.5,20.5 46,24 44.5,20.5 41,19 44.5,17.5" fill="#F3DC7B"/>
</svg>
